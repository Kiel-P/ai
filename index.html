<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; flex-direction: column; height: 100vh; padding: 15px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    select { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; outline: none; font-size: 14px; }
    #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-right: 5px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
    .user { background: #89b4fa; color: #11111b; align-self: flex-end; }
    .bot { background: #313244; align-self: flex-start; border: 1px solid #45475a; }
    .input-box { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; outline: none; }
    button { padding: 12px 20px; background: #89b4fa; color: #11111b; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <label for="modelSelect"><strong>Model:</strong></label>
    <select id="modelSelect">
      <option value="">Memuat daftar model...</option>
    </select>
  </div>

  <div id="chat-container"></div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">Kirim</button>
  </div>

  <script>
    const BASE_URL = 'https://bansos.adiosverm.eu.cc/v1';
    const API_KEY = 'sk-e485d5155bd2d3f1-l2tmyw-ad797790';
    let history = [];

    // Mengambil daftar model aktif secara otomatis
    async function loadModels() {
      const select = document.getElementById('modelSelect');
      try {
        const res = await fetch(`${BASE_URL}/models`, {
          headers: { 'Authorization': `Bearer ${API_KEY}` }
        });
        const data = await res.json();

        select.innerHTML = '';
        if (data.data && data.data.length > 0) {
          data.data.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.id;
            select.appendChild(opt);
          });
        } else {
          select.innerHTML = '<option value="">Tidak ada model tersedia</option>';
        }
      } catch (err) {
        select.innerHTML = '<option value="">Gagal mengambil daftar model</option>';
      }
    }

    async function send() {
      const input = document.getElementById('userInput');
      const select = document.getElementById('modelSelect');
      const text = input.value.trim();
      const selectedModel = select.value;

      if (!text) return;
      if (!selectedModel) {
        alert('Model belum siap atau tidak tersedia!');
        return;
      }

      addMessage(text, 'user');
      history.push({ role: 'user', content: text });
      input.value = '';

      try {
        const res = await fetch(`${BASE_URL}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: history
          })
        });

        const data = await res.json();
        const reply = data.choices[0].message.content;

        addMessage(reply, 'bot');
        history.push({ role: 'assistant', content: reply });
      } catch (err) {
        addMessage('Error: Gagal dapet respon dari server.', 'bot');
      }
    }

    function addMessage(text, sender) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // Jalankan scan model saat halaman di-load
    window.onload = loadModels;
  </script>
</body>
</html>
